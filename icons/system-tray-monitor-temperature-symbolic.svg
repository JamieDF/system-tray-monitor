    A thermometer. Adwaita has no temperature icon; its nearest options are
    weather glyphs, which read as a forecast rather than a sensor.

    This comment must stay INSIDE the svg element. gdk-pixbuf picks a loader by
    sniffing roughly the first 256 bytes, so the opening svg tag has to appear
    within them. Measured here: the tag loads at offset 254 and fails at 258.
  -->
  <g fill="#2e3436">
    <path d="M8 0a2.5 2.5 0 0 0-2.5 2.5v6.1a4 4 0 1 0 5 0V2.5A2.5 2.5 0 0 0 8 0Zm0 1a1.5 1.5 0 0 1 1.5 1.5v6.63l.28.2a3 3 0 1 1-3.56 0l.28-.2V2.5A1.5 1.5 0 0 1 8 1Z"/>
    <path d="M7.25 4h1.5v6.2a2 2 0 1 1-1.5 0Z"/>
  </g>
</svg>
